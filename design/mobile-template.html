<!doctype html>
<html lang="en" data-theme="nightfall">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover + black-translucent is what makes the installed PWA
       paint edge-to-edge; the @media (display-mode: standalone) safe-area
       block in polaris-mobile.css is what keeps the top bar out of the notch.
       Ship both or neither. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- Keep in lockstep with the manifest's theme_color. The theme toggle
       rewrites this at runtime so Android's chrome follows light/dark. -->
  <meta name="theme-color" content="#1d2024">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>App</title>
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-light.png">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/icons/app-apple-180.png">
  <!-- NO crossorigin attribute — a manifest link without one is fetched with
       credentials omitted, which is why the manifest can stay unauthenticated. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/polaris-mobile.css">
</head>
<body>

<!-- ─── SVG sprite ───────────────────────────────────────────────────────
     Inline so every screen can <use href="#i-…"> with no extra fetch. Keep
     ids prefixed `i-`. This is the minimum set the shell itself needs; add
     per-domain icons here rather than fetching them per screen.
     ─────────────────────────────────────────────────────────────────── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M9.5 3a6.5 6.5 0 1 0 4.23 11.43l4.92 4.92 1.42-1.42-4.92-4.92A6.5 6.5 0 0 0 9.5 3Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 5h18v2H3V5Zm0 6h18v2H3v-2Zm0 6h18v2H3v-2Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Zm6-6V11a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2Z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"/></symbol>
  </defs>
</svg>

<!-- ─── App shell ────────────────────────────────────────────────────────
     Tabs render into .app-body. The top app bar and bottom navigation bar
     are owned by app.js and replaced wholesale per route. data-tab on .app
     drives navbar visibility and the active pill (see polaris-mobile.css).
     data-tab="" hides the navbar entirely — that is the boot/login state.
     ─────────────────────────────────────────────────────────────────── -->
<div class="app" id="app" data-tab="">
  <div class="loading-screen" id="boot-loader">
    <div class="spinner"></div>
  </div>
</div>

<!--
  Reference markup for what app.js should render into #app once auth settles.
  Delete this block; it is here so the shapes are in front of you.

  <div class="m3-topbar">
    <div class="leading"><button class="icon-btn"><svg><use href="#i-back"/></svg></button></div>
    <div class="title">Assets</div>
    <div class="trailing"><button class="icon-btn"><svg><use href="#i-refresh"/></svg></button></div>
  </div>

  <div class="m3-searchbar">
    <svg width="24" height="24" fill="currentColor"><use href="#i-search"/></svg>
    <input class="input" placeholder="Search">
    <div class="avatar">JD</div>
  </div>

  <div class="app-body" id="app-body">
    <div class="chip-row">
      <button class="chip selected">All</button>
      <button class="chip">Down</button>
    </div>
    <div class="section-head">Firewalls <span class="count">12</span></div>
    <div class="asset-list">
      <button class="asset-card">
        <div class="top">
          <div class="ico ico-fw"><svg><use href="#i-list"/></svg></div>
          <div class="name">HARBOR-61F-1</div>
          <span class="dot up"></span>
        </div>
        <div class="meta"><span class="mono">10.20.0.1</span><span>Harbor DC</span></div>
      </button>
    </div>
  </div>

  <nav class="m3-navbar">
    <button class="nav-item active">
      <span class="nav-icon-pill"><svg><use href="#i-list"/></svg></span>
      <span class="nav-label">Assets</span>
    </button>
    …four more; the grid is repeat(5, 1fr) — five tabs, no more, no fewer.
  </nav>
-->

<!-- FIRST: beforeinstallprompt can fire before the app boots, so the listener
     must already be installed to capture it. No dependencies. -->
<script src="/js/pwa-install.js"></script>
<script src="/js/api.js"></script>
<!-- Must follow api.js. -->
<script src="/js/push.js"></script>
<script src="/js/mobile/router.js"></script>
<script src="/js/mobile/auth.js"></script>
<!-- Tab modules load BEFORE tabs.js so its renderers can see them. -->
<script src="/js/mobile/tabs.js"></script>
<script src="/js/mobile/app.js"></script>
</body>
</html>
