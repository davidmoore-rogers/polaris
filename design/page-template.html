<!DOCTYPE html>
<!--
  Polaris-style list page boilerplate. Copy this file, rename it, and replace
  the page title / table columns / page script. Do not restructure the shell.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App — Things</title>
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="/css/polaris-ui.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="page-header">
        <h2>Things</h2>
        <div class="page-header-actions">
          <div class="btn-dropdown-wrap">
            <button class="btn btn-secondary" id="btn-export">Export &#9662;</button>
            <div class="btn-dropdown-menu" id="export-menu">
              <div class="dropdown-heading">Export &mdash; CSV</div>
              <button data-export="page">Current page</button>
              <button data-export="filtered">All filtered results</button>
            </div>
          </div>
          <button class="btn btn-primary" id="btn-add">+ Add Thing</button>
        </div>
      </div>

      <!-- Always-visible selection bar: idle until rows are selected. -->
      <div id="things-bulk-bar" class="bulk-bar bulk-bar-idle">
        <span class="bulk-bar-count">No things selected</span>
        <button class="btn btn-sm btn-secondary" id="things-bulk-deselect-btn">Deselect All</button>
        <button class="btn btn-sm btn-danger" id="things-bulk-delete-btn" style="margin-left:auto">Delete selected</button>
      </div>

      <div id="pagination-top"></div>

      <div class="table-wrapper table-wrapper-sticky" id="things-table-wrapper">
        <table id="things-table">
          <thead>
            <tr>
              <th class="cb-col"><input type="checkbox" id="things-select-all" title="Select all on this page"></th>
              <th data-col-id="name" data-col-required="true" data-sf-key="name" data-sf-type="string">Name</th>
              <th data-col-id="owner" data-sf-key="owner" data-sf-type="string">Owner</th>
              <th data-col-id="status" style="width:130px" data-sf-key="status" data-sf-type="string" data-sf-options="active|maintenance|disabled">Status</th>
              <th data-col-id="count" data-sf-key="count" data-sf-type="number" data-sf-nofilter>Count</th>
              <th data-col-id="notes" data-sf-key="notes" data-sf-type="string" data-col-default-hidden="true">Notes</th>
              <th data-col-id="updatedAt" data-sf-key="updatedAt" data-sf-type="date">Updated</th>
            </tr>
          </thead>
          <tbody id="things-tbody">
            <tr><td colspan="7" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>

      <div id="pagination"></div>
    </main>
  </div>

  <script src="/js/polaris-ui.js"></script>
  <script src="/js/table-sf.js"></script>
  <script src="/js/things.js"></script>
</body>
</html>
