# /etc/tmpfiles.d/polaris-nginx.conf — staging directory under tmpfs for the
# in-app nginx GUI. The polaris user writes proposed nginx configs and
# proposed cert/key pairs here; /usr/local/sbin/polaris-nginx-apply (as root,
# via sudoers) picks them up and atomic-renames them into place.
#
# Mode 0750 polaris:polaris means polaris owns the dir (can write files) and
# root can traverse it (the wrapper runs as root). Nothing else can read it,
# so a stale cert/key pair in flight isn't world-visible.
#
# systemd-tmpfiles --create runs this entry at boot (and on demand from the
# installer / updater scripts).
d /run/polaris-nginx-stage 0750 polaris polaris -
