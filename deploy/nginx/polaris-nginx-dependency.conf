# deploy/nginx/polaris-nginx-dependency.conf — systemd drop-in installed at
# /etc/systemd/system/polaris-web.service.d/nginx-dependency.conf by the
# migrate-to-nginx.sh script.
#
# Wants= (not Requires=) so a failed nginx doesn't block polaris-web from
# starting. Recovery story: if nginx is broken, polaris-web still comes up
# on 127.0.0.1:3000, the operator can SSH in and fix nginx without having
# to bring Polaris back from a separate broken state.
#
# After= orders nginx-first start so the typical happy-path boot sequence
# is nginx → polaris-web; this avoids transient "502 bad gateway" responses
# during a `systemctl restart polaris.target`.

[Unit]
Wants=nginx.service
After=nginx.service
